document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

e: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Montserrat';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"1303d812-8c63-484f-b0be-f4a942ef1dee\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root{\n    --cream:#F5F0EB;\n    --cream-2:#EBE4DA;\n    --navy:#17120b;\n    --navy-soft:#231c12;\n    --blue:#4186ff;\n    --blue-dark:#225e84;\n    --blue-light:#bdd6ff;\n    --ink:#17120b;\n    --ink-60:rgba(23,18,11,.6);\n    --ink-40:rgba(23,18,11,.4);\n    --ink-15:rgba(23,18,11,.15);\n    --cream-60:rgba(245,240,235,.62);\n    --cream-25:rgba(245,240,235,.28);\n    --serif:\"Lora\",Georgia,serif;\n    --sans:\"Montserrat\",system-ui,-apple-system,sans-serif;\n  }\n  *{box-sizing:border-box;}\n  html,body{margin:0;background:#0a0a0a;}\n  deck-stage:not(:defined){visibility:hidden;}\n\n  /* ---------- Slides base ---------- */\n  section{\n    background:var(--cream);\n    color:var(--ink);\n    font-family:var(--sans);\n    overflow:hidden;\n  }\n  section.dark{background:var(--navy);color:var(--cream);}\n  .slide-pad{padding:96px 110px;}\n\n  /* ---------- Editorial primitives ---------- */\n  .eyebrow{\n    font-size:24px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;\n    color:var(--blue);margin:0;\n  }\n  .dark .eyebrow{color:var(--blue-light);}\n  .ttl-xl{\n    font-family:var(--serif);font-weight:600;line-height:.98;letter-spacing:-.01em;\n    font-size:128px;margin:0;text-wrap:balance;\n  }\n  .ttl-lg{\n    font-family:var(--serif);font-weight:600;line-height:1.02;letter-spacing:-.01em;\n    font-size:82px;margin:0;text-wrap:balance;\n  }\n  .lede{\n    font-size:28px;line-height:1.5;color:var(--ink-60);max-width:18em;margin:0;font-weight:400;\n  }\n  .dark .lede{color:var(--cream-60);}\n  .rule-thin{height:1px;background:var(--ink-15);border:0;width:100%;}\n  .dark .rule-thin{background:var(--cream-25);}\n  .cream{color:var(--cream);}\n\n  .micro{font-size:24px;letter-spacing:.02em;color:var(--ink-40);margin:0;}\n  .dark .micro{color:var(--cream-60);}\n\n  /* Orkesta logo */\n  .ork-logo{height:1em;width:auto;vertical-align:-.1em;object-fit:contain;}\n  .ork-logo-dark{filter:brightness(0) saturate(100%);}\n  .lockup{display:flex;align-items:center;gap:.52em;font-size:48px;color:var(--ink);}\n  .dark .lockup{color:var(--cream);}\n  .lockup .wordmark{font-family:var(--serif);font-weight:600;letter-spacing:.005em;font-size:1em;}\n  .lockup .ork-logo{height:1.08em;width:auto;}\n\n  /* hand-drawn arrow accent */\n  .hand-arrow{color:var(--blue);width:118px;height:58px;display:block;}\n\n  /* ---------- 1 · Portada ---------- */\n  .s-cover{position:relative;}\n  .s-cover image-slot{position:absolute;inset:0;width:100%;height:100%;}\n  .cover-scrim{position:absolute;inset:0;background:\n     linear-gradient(180deg,rgba(8,20,28,.62) 0%,rgba(8,20,28,.30) 38%,rgba(8,20,28,.78) 100%);}\n  .cover-content{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;}\n  .cover-bottom{max-width:1300px;}\n  .cover-bottom .ttl-xl{color:var(--cream);margin:0 0 30px;}\n  .cover-bottom .rule-thin{background:var(--cream-25);max-width:520px;margin-bottom:26px;}\n  .cover-sub{font-size:26px;line-height:1.45;color:var(--cream-60);margin:0;max-width:24em;}\n  .cover-bottom .eyebrow{margin-bottom:28px;}\n\n  /* ---------- 2 · El problema ---------- */\n  .s-prob{display:flex;flex-direction:column;}\n  .prob-grid{display:grid;grid-template-columns:1.04fr .96fr;gap:84px;align-items:center;flex:1;margin-top:46px;}\n  .prob-grid .ttl-lg{margin-bottom:34px;}\n  .data-card{border-left:2px solid var(--blue);padding-left:40px;}\n  .data-card .eyebrow{font-size:24px;letter-spacing:.16em;color:var(--ink-40);}\n  .bignum{\n    font-family:var(--serif);font-weight:600;line-height:.92;letter-spacing:-.02em;\n    font-size:100px;margin:14px 0 14px;color:var(--navy);font-variant-numeric:tabular-nums;\n  }\n  .bar{display:flex;height:22px;border-radius:2px;overflow:hidden;background:var(--cream-2);margin:34px 0 16px;}\n  .bar-resp{background:var(--blue);height:100%;}\n  .bar-lost{background:var(--navy);height:100%;}\n  .bar-legend{display:flex;gap:30px;font-size:24px;color:var(--ink-60);}\n  .bar-legend b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;}\n  .bar-legend .sw{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:8px;vertical-align:middle;}\n\n  /* ---------- 3 · Bifurcación Xochimilco ---------- */\n  .s-fork{display:flex;flex-direction:column;}\n  .s-fork header{max-width:1500px;}\n  .s-fork header .ttl-lg{margin:18px 0 18px;}\n  .fork{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:50px;flex:1;border-top:1px solid var(--ink-15);}\n  .path{padding:44px 56px 10px;position:relative;}\n  .path + .path{border-left:1px solid var(--ink-15);}\n  .path-tag{font-size:24px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--ink-40);}\n  .path-tag.teal-tag{color:var(--blue);}\n  .path h3{font-family:var(--serif);font-weight:600;font-size:38px;line-height:1.1;margin:16px 0 26px;letter-spacing:-.01em;}\n  .path-num{font-family:var(--serif);font-weight:600;font-size:100px;line-height:.95;margin:0 0 10px;color:var(--navy);}\n  .path-a .path-num{color:var(--ink-40);}\n  .path-cap{font-size:24px;color:var(--ink-60);margin:14px 0 28px;max-width:15em;}\n  .path-cost{font-size:24px;font-weight:600;margin:22px 0 0;font-variant-numeric:tabular-nums;}\n  .path-cost.teal{color:var(--blue);}\n  .path-body{font-size:24px;line-height:1.45;color:var(--ink-60);margin:0 0 4px;max-width:17em;}\n  .path-b{background:rgba(65,134,255,.07);}\n  .path-annot{font-size:24px;color:var(--ink-40);margin-top:14px;}\n\n  /* ---------- 4 · Qué hace ---------- */\n  .s-what{display:flex;flex-direction:column;justify-content:center;}\n  .s-what .ttl-lg{margin:16px 0 12px;}\n  .whats{list-style:none;margin:80px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:0;}\n  .whats li{padding:0 46px;border-left:1px solid var(--cream-25);}\n  .whats li:first-child{padding-left:0;border-left:0;}\n  .wn{font-family:var(--serif);font-size:38px;color:var(--blue-light);display:block;margin-bottom:30px;font-weight:500;}\n  .whats h3{font-family:var(--serif);font-weight:600;font-size:38px;line-height:1.12;margin:0 0 20px;color:var(--cream);letter-spacing:-.01em;}\n  .whats p{font-size:26px;line-height:1.5;color:var(--cream-60);margin:0;}\n\n  /* ---------- 5 · La gente ---------- */\n  .s-people .ttl-lg{margin:16px 0 0;max-width:16em;}\n  .people-grid{display:grid;grid-template-columns:.92fr 1.08fr;gap:88px;margin-top:54px;align-items:start;}\n  .people-grid .lede{max-width:none;}\n  .redist{display:flex;flex-direction:column;gap:34px;}\n  .redist .stack-label{font-size:24px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--ink-40);margin:0 0 12px;}\n  .stack{display:flex;height:62px;border-radius:3px;overflow:hidden;}\n  .seg-rep{background:var(--navy);display:flex;align-items:center;padding:0 18px;color:var(--cream-60);font-size:24px;font-weight:500;}\n  .seg-val{background:var(--blue);display:flex;align-items:center;padding:0 18px;color:#fff;font-size:24px;font-weight:600;}\n  .redist-key{display:flex;gap:28px;font-size:24px;color:var(--ink-60);margin-top:4px;}\n  .redist-key .sw{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:8px;vertical-align:middle;}\n  .nau-strip{display:flex;gap:64px;margin-top:42px;padding-top:30px;border-top:1px solid var(--ink-15);}\n  .nau-strip .n{font-family:var(--serif);font-weight:600;font-size:54px;line-height:1;color:var(--navy);font-variant-numeric:tabular-nums;}\n  .nau-strip .c{font-size:24px;color:var(--ink-60);margin-top:8px;max-width:13em;}\n  . filler{}\n  .quote-line{font-size:24px;color:var(--ink-40);margin-top:18px;font-style:italic;}\n\n  /* ---------- 6 · El camino ---------- */\n  .s-path{display:flex;flex-direction:column;justify-content:center;}\n  .s-path .ttl-lg{margin:16px 0 0;}\n  .timeline{list-style:none;margin:100px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:0;position:relative;}\n  .timeline::before{content:\"\";position:absolute;top:13px;left:0;right:0;height:1px;background:var(--ink-15);}\n  .timeline li{padding-right:46px;position:relative;}\n  .tl-dot{width:26px;height:26px;border-radius:50%;background:var(--cream);border:2px solid var(--blue);position:relative;z-index:1;}\n  .tl-dot.fill{background:var(--blue);}\n  .tl-step{font-family:var(--serif);font-size:26px;color:var(--blue);margin:30px 0 14px;font-weight:500;}\n  .timeline h3{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.14;margin:0 0 14px;letter-spacing:-.01em;}\n  .timeline p{font-size:26px;line-height:1.45;color:var(--ink-60);margin:0;}\n  .timeline .arrow{color:var(--ink-40);font-weight:600;}\n\n  /* ---------- 7 · El acuerdo ---------- */\n  .s-deal .ttl-lg{margin:14px 0 0;}\n  .deal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:52px;border-top:1px solid var(--ink-15);}\n  .deal-block{padding:40px 46px 30px;border-left:1px solid var(--ink-15);}\n  .deal-block:first-child{padding-left:0;border-left:0;}\n  .deal-when{font-size:24px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--blue);margin:0 0 18px;}\n  .deal-amt{font-family:var(--serif);font-weight:600;font-size:46px;line-height:1.04;margin:0 0 12px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;}\n  .deal-block p.d{font-size:24px;line-height:1.4;color:var(--ink-60);margin:0;}\n  .roi-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:40px;background:var(--navy);border-radius:3px;}\n  .roi-cell{padding:30px 40px;color:var(--cream);border-left:1px solid var(--cream-25);}\n  .roi-cell:first-child{border-left:0;}\n  .roi-cell .rl{font-size:24px;letter-spacing:.12em;text-transform:uppercase;color:var(--cream-60);margin:0 0 12px;font-weight:600;}\n  .roi-cell .rv{font-family:var(--serif);font-weight:600;font-size:44px;line-height:1;margin:0;font-variant-numeric:tabular-nums;}\n  .roi-cell .rv.blue{color:var(--blue-light);}\n  .roi-cell .rn{font-size:24px;color:var(--cream-60);margin:10px 0 0;}\n  .deal-foot{font-size:24px;color:var(--ink-40);margin:26px 0 0;}\n\n  /* ---------- 8 · Cierre ---------- */\n  .s-close{display:flex;flex-direction:column;justify-content:space-between;position:relative;}\n  .close-mark{line-height:1;}\n  .close-mark .iap-logo{height:120px;width:auto;}\n  .close-mark .ork-logo{height:140px;width:auto;}\n  .s-close .ttl-xl{color:var(--cream);max-width:13em;}\n  .close-foot{display:flex;justify-content:space-between;align-items:flex-end;}\n  .contact{display:flex;flex-direction:column;gap:6px;}\n  .contact .ck{font-size:24px;letter-spacing:.16em;text-transform:uppercase;color:var(--cream-60);font-weight:600;margin-bottom:10px;}\n  .contact .cv{font-size:26px;color:var(--cream);}\n  .contact .cv span{color:var(--cream-60);}\n\n  /* iAutopartes logo */\n  .iap-logo{height:auto;width:auto;object-fit:contain;}\n  .cover-iap-logo{height:190px;width:auto;object-fit:contain;}\n\n  /* download button */\n  .dl-btn{display:inline-flex;align-items:center;gap:10px;background:var(--blue);color:#fff;\n    font-family:var(--sans);font-size:20px;font-weight:600;letter-spacing:.04em;\n    padding:16px 32px;border:none;border-radius:3px;cursor:pointer;text-transform:uppercase;\n    transition:background .18s,transform .18s;margin-top:24px;}\n  .dl-btn:hover{background:#225eda;transform:translateY(-1px);}\n  .dl-btn svg{width:22px;height:22px;flex-shrink:0;}\n  @media print{.dl-btn{display:none!important;}}\n\n  /* entrance animations removed — deck is print-focused */\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<deck-stage width=\"1920\" height=\"1080\">\n\n  <!-- ════════ 1 · PORTADA ════════ -->\n  <section class=\"s-cover dark\" data-label=\"Portada\" data-screen-label=\"01 Portada\">\n    <image-slot id=\"cover-img\" shape=\"rect\" fit=\"cover\" placeholder=\"Arrastra una foto: taller, refacciones o conversación · oscura, con textura\"><\u002Fimage-slot>\n    <div class=\"cover-scrim\"><\u002Fdiv>\n    <div class=\"cover-content slide-pad\">\n      <div>\n        <img src=\"dd8bb0c8-a775-466b-8389-45b03ccc1f50\" class=\"cover-iap-logo\" alt=\"iAutopartes\" style=\"margin-bottom:28px;\">\n        <p class=\"eyebrow anim\">Orkesta Retail · para iAutopartes<\u002Fp>\n        <h1 class=\"ttl-xl anim-2\">Lo que podrías<br>estar vendiendo<\u002Fh1>\n        <hr class=\"rule-thin\">\n        <p class=\"cover-sub\">Preparado para el Ing. Pablo Tallabs<br>Sucursal Naucalpan de iAutopartes<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ════════ 2 · EL PROBLEMA ════════ -->\n  <section class=\"s-prob slide-pad\" data-label=\"El problema\" data-screen-label=\"02 El problema\">\n    <p class=\"eyebrow\">El problema · <span data-bind=\"branchLabel\" data-fmt=\"text\">Naucalpan<\u002Fspan><\u002Fp>\n    <div class=\"prob-grid\">\n      <div>\n        <h2 class=\"ttl-lg anim\">Cada mensaje sin respuesta es una venta que se fue.<\u002Fh2>\n        <p class=\"lede\">Más publicidad cuando la respuesta no da abasto no multiplica las ventas: multiplica el gasto. Llegan más mensajes al mismo equipo, que ya está al límite. No es falta de esfuerzo. Es falta de capacidad.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"data-card anim-2\">\n        <p class=\"eyebrow\">Lo que hoy se escapa cada mes<\u002Fp>\n        <p class=\"bignum\"><span data-bind=\"ingresoPerdidoMes\" data-fmt=\"money\">$ —<\u002Fspan><\u002Fp>\n        <p class=\"micro\">en <span data-bind=\"branchLabel\" data-fmt=\"text\">Naucalpan<\u002Fspan>, con los supuestos de hoy · editable en vivo<\u002Fp>\n        <div class=\"bar\">\n          <span class=\"bar-resp\" data-bar=\"atendidosPct\"><\u002Fspan>\n          <span class=\"bar-lost\" data-bar=\"sinRespPct\"><\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"bar-legend\">\n          <span><span class=\"sw\" style=\"background:var(--blue)\"><\u002Fspan><b data-bind=\"atendidosMes\">0<\u002Fb> se responden<\u002Fspan>\n          <span><span class=\"sw\" style=\"background:var(--navy)\"><\u002Fspan><b data-bind=\"sinRespMes\">0<\u002Fb> sin responder / mes<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ════════ 3 · QUÉ HACE ORKESTA ════════ -->\n  <section class=\"s-what dark slide-pad\" data-label=\"Qué hace Orkesta\" data-screen-label=\"03 Qué hace Orkesta\">\n    <p class=\"eyebrow\">Orkesta Retail<\u002Fp>\n    <h2 class=\"ttl-lg cream anim\">Tres cosas. Bien hechas.<\u002Fh2>\n    <ol class=\"whats anim-2\">\n      <li>\n        <span class=\"wn\">01<\u002Fspan>\n        <h3>Responde donde te escriben<\u002Fh3>\n        <p>WhatsApp, Instagram y Messenger, 24/7, con los datos reales de tu catálogo.<\u002Fp>\n      <\u002Fli>\n      <li>\n        <span class=\"wn\">02<\u002Fspan>\n        <h3>Ordena cada conversación<\u002Fh3>\n        <p>Cada chat, pedido y cliente queda en un CRM visual. Nada se pierde en un celular.<\u002Fp>\n      <\u002Fli>\n      <li>\n        <span class=\"wn\">03<\u002Fspan>\n        <h3>Tus vendedores mandan<\u002Fh3>\n        <p>Toman el control cuando quieren. La IA cubre lo demás, sin estorbar.<\u002Fp>\n      <\u002Fli>\n    <\u002Fol>\n  <\u002Fsection>\n\n  <!-- ════════ 4 · LA GENTE ════════ -->\n  <section class=\"s-people slide-pad\" data-label=\"La gente\" data-screen-label=\"04 La gente\">\n    <p class=\"eyebrow\">No se trata de reemplazar a nadie<\u002Fp>\n    <h2 class=\"ttl-lg anim\">No se contrata menos gente.<br>Se contrata gente para lo que importa.<\u002Fh2>\n    <div class=\"people-grid\">\n      <div>\n        <p class=\"lede\">Los vendedores de iAutopartes dejan de gastarse en «¿Tienes espejos de Aveo 2018?» y se dedican a lo que sí deja margen: prospectar, dar seguimiento a cuentas grandes, atender a quien ya compró.<\u002Fp>\n        <div class=\"nau-strip\">\n          <div>\n            <div class=\"n\"><span data-bind=\"vendedoresLiberados\" data-branch=\"naucalpan\">0<\u002Fspan><\u002Fdiv>\n            <div class=\"c\">vendedores de iAutopartes Naucalpan liberados para vender, no para teclear<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div class=\"n\"><span data-bind=\"ingresoRecuperadoMes\" data-branch=\"naucalpan\" data-fmt=\"money\">$ —<\u002Fspan><\u002Fdiv>\n            <div class=\"c\">en ventas que hoy se escapan y podrían entrar cada mes<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"redist anim-2\">\n        <div>\n          <p class=\"stack-label\">Hoy · el vendedor se reparte<\u002Fp>\n          <div class=\"stack\">\n            <span class=\"seg-rep\" style=\"width:62%\">Responder lo repetitivo<\u002Fspan>\n            <span class=\"seg-val\" style=\"width:38%\">Vender<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <p class=\"stack-label\">Con Orkesta · el vendedor se enfoca<\u002Fp>\n          <div class=\"stack\">\n            <span class=\"seg-rep\" style=\"width:12%\"><\u002Fspan>\n            <span class=\"seg-val\" style=\"width:88%\">Prospectar · cuentas grandes · cerrar<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"redist-key\">\n          <span><span class=\"sw\" style=\"background:var(--navy)\"><\u002Fspan>Tareas repetitivas<\u002Fspan>\n          <span><span class=\"sw\" style=\"background:var(--blue)\"><\u002Fspan>Tareas que generan margen<\u002Fspan>\n        <\u002Fdiv>\n        <p class=\"quote-line\">Reparto ilustrativo del tiempo del vendedor.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ════════ 5 · EL CAMINO ════════ -->\n  <section class=\"s-path slide-pad\" data-label=\"El camino\" data-screen-label=\"05 El camino\">\n    <p class=\"eyebrow\">El camino<\u002Fp>\n    <h2 class=\"ttl-lg anim\">Sin fechas. Solo dirección.<\u002Fh2>\n    <ol class=\"timeline anim-2\">\n      <li>\n        <div class=\"tl-dot fill\"><\u002Fdiv>\n        <p class=\"tl-step\">01<\u002Fp>\n        <h3>Mes de evaluación<\u002Fh3>\n        <p>Datos reales de la operación de iAutopartes, sin costo. <span class=\"arrow\">→<\u002Fspan><\u002Fp>\n      <\u002Fli>\n      <li>\n        <div class=\"tl-dot\"><\u002Fdiv>\n        <p class=\"tl-step\">02<\u002Fp>\n        <h3>Sucursales piloto<\u002Fh3>\n        <p>Implementación que pasa a operación continua. <span class=\"arrow\">→<\u002Fspan><\u002Fp>\n      <\u002Fli>\n      <li>\n        <div class=\"tl-dot\"><\u002Fdiv>\n        <p class=\"tl-step\">03<\u002Fp>\n        <h3>Nuevas sucursales<\u002Fh3>\n        <p>Expansión y estandarización del modelo. <span class=\"arrow\">→<\u002Fspan><\u002Fp>\n      <\u002Fli>\n      <li>\n        <div class=\"tl-dot\"><\u002Fdiv>\n        <p class=\"tl-step\">04<\u002Fp>\n        <h3>Matriz<\u002Fh3>\n        <p>Todo iAutopartes con una sola plataforma.<\u002Fp>\n      <\u002Fli>\n    <\u002Fol>\n  <\u002Fsection>\n\n  <!-- ════════ 6 · EL ACUERDO ════════ -->\n  <section class=\"s-deal slide-pad\" data-label=\"El acuerdo\" data-screen-label=\"06 El acuerdo\">\n    <p class=\"eyebrow\">El acuerdo · <span data-bind=\"branchLabel\" data-fmt=\"text\">Naucalpan<\u002Fspan><\u002Fp>\n    <h2 class=\"ttl-lg anim\">Claro, y a favor<br>de iAutopartes.<\u002Fh2>\n    <div class=\"deal-grid anim-2\">\n      <div class=\"deal-block\">\n        <p class=\"deal-when\">Mes 1<\u002Fp>\n        <p class=\"deal-amt\">Evaluación tml>';\n      var clone=document.documentElement.cloneNode(true);\n      var fab=clone.querySelector('#ork-panel-fab'); if(fab) fab.remove();\n      var pan=clone.querySelector('#ork-panel'); if(pan) pan.remove();\n      var head=clone.querySelector('head');\n      var s=document.createElement('script');\n      s.textContent='try{localStorage.setItem(\"'+stateKey+'\",'+JSON.stringify(saved)+')}catch(e){}';\n      head.appendChild(s);\n      var html=doctype+'\\n'+clone.outerHTML;\n      var blob=new Blob([html],{type:'text/html;charset=utf-8'});\n      var a=document.createElement('a');\n      a.href=URL.createObjectURL(blob);\n      a.download='Orkesta - iAutopartes (con datos).html';\n      document.body.appendChild(a);\n      a.click();\n      setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(a.href);},200);\n    }catch(e){alert('Error al descargar: '+e.message);}\n  }\n<\u002Fscript>\n\n\n\n\n\n<\u002Fbody><\u002Fhtml>"
